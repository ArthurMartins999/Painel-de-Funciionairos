<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vendas De Figurinha 2026 | Mobile & PC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --gold: #D4AF37; --cup-green: #009639; --cup-yellow: #FFDF00; --cup-blue: #002776; }
        body { background-color: #000; color: #fff; margin: 0; }
        
        .card-figurinha {
            background: linear-gradient(135deg, rgba(20,20,20,1) 0%, rgba(40,40,40,1) 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }
        .card-figurinha::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(212,175,55,0.05), transparent);
            transform: rotate(45deg);
            animation: shine 6s infinite;
        }
        @keyframes shine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }

        .cup-gradient { background: linear-gradient(90deg, var(--cup-green), var(--cup-yellow), var(--cup-blue)); }
        .glass { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(10px); }
        
        /* Ajuste para scrollbar no PC */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        /* Esconder sidebar no mobile e mostrar via JS se quiser, ou manter simples */
        @media (max-width: 768px) {
            .sidebar-desk { display: none; }
            .main-content { padding: 20px !important; }
        }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 flex items-center justify-center z-[100] bg-black p-6">
        <div class="bg-[#0a0a0a] p-8 md:p-12 rounded-[30px] shadow-2xl w-full max-w-md border border-gold/20 text-center">
            <svg class="mx-auto mb-6" width="60" height="60" viewBox="0 0 100 100">
                <rect x="20" y="20" width="60" height="60" rx="8" fill="none" stroke="#D4AF37" stroke-width="3" transform="rotate(-10 50 50)"/>
                <rect x="25" y="25" width="60" height="60" rx="8" fill="#D4AF37" transform="rotate(5 50 50)"/>
                <text x="50%" y="62%" text-anchor="middle" fill="black" font-family="Arial" font-weight="black" font-size="20">VF26</text>
            </svg>
            <h2 class="text-xl font-black text-white uppercase italic mb-8">Vendas De Figurinha</h2>
            <div class="space-y-4">
                <input type="text" id="user-input" placeholder="Usuário" class="w-full p-4 bg-black border border-white/10 rounded-xl focus:border-gold outline-none text-white text-center">
                <input type="password" id="pass-input" placeholder="Senha" class="w-full p-4 bg-black border border-white/10 rounded-xl focus:border-gold outline-none text-white text-center">
                <button onclick="fazerLogin()" class="w-full bg-gold text-black font-black py-4 rounded-xl hover:scale-105 transition-all uppercase italic">Entrar</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-dashboard" class="flex flex-col md:flex-row h-screen overflow-hidden hidden">
        
        <!-- SIDEBAR (Escondida no Mobile, mas vira um Top Bar) -->
        <aside class="sidebar-desk w-72 bg-[#050505] border-r border-gold/10 flex flex-col">
            <div class="p-8 font-black text-gold italic border-b border-white/5">FIGURINHA 2026</div>
            <nav class="flex-1 p-6 space-y-4">
                <div class="p-4 rounded-xl bg-gold/10 text-gold font-bold text-xs">📊 DASHBOARD</div>
                <div id="admin-menu" class="hidden pt-4 space-y-2 border-t border-white/5">
                    <button onclick="gerarPDF()" class="w-full text-left p-4 rounded-xl text-emerald-400 text-[10px] font-bold border border-emerald-500/10 uppercase">Exportar PDF</button>
                </div>
            </nav>
            <div class="p-6 border-t border-white/5">
                <p id="display-user" class="text-[10px] text-white/50 uppercase mb-4 text-center"></p>
                <button onclick="logout()" class="w-full py-2 text-red-500 text-[9px] font-bold uppercase">Sair</button>
            </div>
        </aside>

        <!-- TOP BAR MOBILE -->
        <div class="md:hidden flex justify-between items-center p-4 bg-[#050505] border-b border-gold/10">
            <span class="text-gold font-black italic">VF26</span>
            <button onclick="logout()" class="text-red-500 text-[10px] font-bold">SAIR</button>
        </div>

        <!-- CONTENT -->
        <main class="main-content flex-1 overflow-y-auto p-6 md:p-12">
            
            <header class="mb-10 text-center md:text-left">
                <h1 class="text-3xl md:text-5xl font-black italic">WORLD <span class="text-gold">CUP</span></h1>
                <div id="total-empresa-area" class="hidden mt-4 inline-block bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20">
                    <p class="text-[8px] text-emerald-500 font-bold uppercase">Empresa Total</p>
                    <h2 id="faturamento-total" class="text-xl font-bold">R$ 0,00</h2>
                </div>
            </header>

            <!-- KPI CARDS - Grid responsivo: 1 coluna no mobile, 4 no PC -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                <div class="card-figurinha p-6 rounded-2xl text-center md:text-left">
                    <p class="text-white/40 text-[9px] font-bold uppercase mb-1 italic">Sua Meta</p>
                    <h3 id="meta-display" class="text-xl font-black">R$ 0,00</h3>
                </div>
                <div class="card-figurinha p-6 rounded-2xl border-l-4 border-l-blue-500 text-center md:text-left">
                    <p class="text-blue-400 text-[9px] font-bold uppercase mb-1 italic">Suas Vendas</p>
                    <h3 id="vendas-user-display" class="text-xl font-black">R$ 0,00</h3>
                </div>
                <div id="card-comissao" class="hidden card-figurinha p-6 rounded-2xl border-l-4 border-l-emerald-500 text-center md:text-left">
                    <p class="text-emerald-400 text-[9px] font-bold uppercase mb-1 italic">Bônus (20%)</p>
                    <h3 id="comissao-display" class="text-xl font-black">R$ 0,00</h3>
                    <p id="aviso-meta" class="text-[8px] text-white/30 mt-1 uppercase">Meta pendente</p>
                </div>
                <div class="card-figurinha p-6 rounded-2xl border-l-4 border-l-gold text-center md:text-left">
                    <p class="text-gold text-[9px] font-bold uppercase mb-1 italic">Líder Atual</p>
                    <h3 id="lider-ranking" class="text-xl font-black uppercase italic">---</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- LANÇAMENTO -->
                <div class="lg:col-span-1">
                    <div class="glass p-6 md:p-8 rounded-[30px] border border-white/5">
                        <h2 class="text-white font-black italic mb-6 uppercase text-[10px] tracking-widest">Nova Venda</h2>
                        <input type="number" id="valor-venda" placeholder="R$ 0,00" class="w-full p-4 bg-black border border-white/10 rounded-2xl text-3xl font-black text-white mb-4 text-center">
                        <button onclick="publicarVenda()" class="w-full cup-gradient text-black font-black py-4 rounded-2xl italic uppercase text-sm">Confirmar</button>
                    </div>

                    <!-- GESTÃO (SÓ DONO) -->
                    <div id="area-dono" class="hidden mt-6 glass p-6 rounded-[30px] border border-white/5">
                        <h2 class="text-gold font-bold italic mb-4 uppercase text-[10px]">Gestão de Metas</h2>
                        <select id="select-funcionario" class="w-full p-3 bg-black border border-white/10 rounded-xl mb-3 text-white text-xs">
                            <option value="fonseca">FONSECA</option>
                            <option value="alerrandro">ALERRANDRO</option>
                            <option value="rafael">RAFAEL</option>
                        </select>
                        <input type="number" id="nova-meta" placeholder="Valor da Meta" class="w-full p-3 bg-black border border-white/10 rounded-xl mb-3 text-white text-xs">
                        <button onclick="definirMeta()" class="w-full bg-white text-black font-bold py-3 rounded-xl text-[10px] uppercase">Salvar Meta</button>
                    </div>
                </div>

                <!-- ANALYTICS E TABELA -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass p-6 rounded-[30px] h-64 flex flex-col items-center">
                             <canvas id="chartPizza"></canvas>
                        </div>
                        <div id="ranking-lista" class="glass p-6 rounded-[30px] space-y-4">
                            <!-- Ranking entra aqui -->
                        </div>
                    </div>

                    <!-- TABELA COM SCROLL PARA MOBILE -->
                    <div class="glass p-6 rounded-[30px] overflow-hidden">
                        <h2 class="text-[10px] font-black uppercase mb-4 text-white/50">Histórico</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs" id="tabela-print">
                                <thead>
                                    <tr class="text-white/20 uppercase border-b border-white/5">
                                        <th class="py-3 pr-4">Vendedor</th>
                                        <th class="py-3 pr-4">Valor</th>
                                        <th class="py-3">Ação</th>
                                    </tr>
                                </thead>
                                <tbody id="tabela-vendas" class="font-bold"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD01s35w-vJrhLmYbxtD5xFkeCsAV_eak4",
            authDomain: "estudos-de-ia-e59fb.firebaseapp.com",
            databaseURL: "https://estudos-de-ia-e59fb-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "estudos-de-ia-e59fb",
            storageBucket: "estudos-de-ia-e59fb.firebasestorage.app",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let myChart = null;

        const usuarios = {
            "arthur": { senha: "arthur2325", cargo: "dono" },
            "sasse": { senha: "sasse2026", cargo: "dono" },
            "fonseca": { senha: "fonseca2026", cargo: "funcionario" },
            "alerrandro": { senha: "alerrandro2020", cargo: "funcionario" },
            "rafael": { senha: "rafael123", cargo: "funcionario" }
        };

        window.fazerLogin = function() {
            const user = document.getElementById('user-input').value.toLowerCase().trim();
            const pass = document.getElementById('pass-input').value;
            if (usuarios[user] && usuarios[user].senha === pass) {
                localStorage.setItem('usuarioLogado', user);
                localStorage.setItem('cargo', usuarios[user].cargo);
                location.reload(); 
            } else { alert("DADOS INCORRETOS."); }
        }

        window.logout = function() { localStorage.clear(); location.reload(); }

        function initDashboard() {
            const user = localStorage.getItem('usuarioLogado');
            const cargo = localStorage.getItem('cargo');
            if (!user) {
                document.getElementById('login-screen').classList.remove('hidden');
                return;
            }

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('display-user').innerText = `Atleta: ${user}`;

            if (cargo === 'dono') {
                document.getElementById('area-dono').classList.remove('hidden');
                document.getElementById('total-empresa-area').classList.remove('hidden');
                document.getElementById('admin-menu').classList.remove('hidden');
            } else {
                document.getElementById('card-comissao').classList.remove('hidden');
            }
            escutarDados();
        }

        window.publicarVenda = function() {
            const valor = document.getElementById('valor-venda').value;
            const user = localStorage.getItem('usuarioLogado');
            if(!valor || valor <= 0) return;

            push(ref(db, 'vendas/'), {
                vendedor: user,
                valor: parseFloat(valor),
                data: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
                dataISO: new Date().toISOString().split('T')[0]
            });
            document.getElementById('valor-venda').value = "";
        }

        window.apagarVenda = function(id) {
            if(confirm("Estornar?")) remove(ref(db, 'vendas/' + id));
        }

        window.definirMeta = function() {
            const func = document.getElementById('select-funcionario').value;
            const meta = document.getElementById('nova-meta').value;
            set(ref(db, 'metas/' + func), { valor: parseFloat(meta) });
            alert("Meta atualizada.");
        }

        window.escutarDados = function() {
            const userLogado = localStorage.getItem('usuarioLogado');
            const cargo = localStorage.getItem('cargo');

            onValue(ref(db, 'metas/'), (snapMetas) => {
                const metas = snapMetas.val() || {};
                document.getElementById('meta-display').innerText = `R$ ${(metas[userLogado]?.valor || 0).toLocaleString('pt-BR')}`;
                
                onValue(ref(db, 'vendas/'), (snapVendas) => {
                    processarTudo(metas, snapVendas.val() || {}, userLogado, cargo);
                });
            });
        }

        function processarTudo(metas, vendas, userLogado, cargo) {
            let totalGeral = 0;
            let meuTotal = 0;
            const totaisPorFunc = { fonseca:0, alerrandro:0, rafael:0 };
            const tabela = document.getElementById('tabela-vendas');
            tabela.innerHTML = "";

            Object.entries(vendas).reverse().forEach(([id, v]) => {
                totalGeral += v.valor;
                if(v.vendedor === userLogado) meuTotal += v.valor;
                if(totaisPorFunc[v.vendedor] !== undefined) totaisPorFunc[v.vendedor] += v.valor;

                tabela.innerHTML += `
                    <tr class="border-b border-white/5">
                        <td class="py-3 text-gold uppercase italic">${v.vendedor}</td>
                        <td class="py-3">R$ ${v.valor.toLocaleString('pt-BR')}</td>
                        <td class="py-3">
                            ${cargo === 'dono' ? `<button onclick="apagarVenda('${id}')" class="text-red-500">Apagar</button>` : `<span class="text-white/20">${v.data}</span>`}
                        </td>
                    </tr>
                `;
            });

            document.getElementById('faturamento-total').innerText = `R$ ${totalGeral.toLocaleString('pt-BR')}`;
            document.getElementById('vendas-user-display').innerText = `R$ ${meuTotal.toLocaleString('pt-BR')}`;

            if (cargo !== 'dono') {
                const metaPessoal = metas[userLogado]?.valor || 0;
                const comissaoCard = document.getElementById('comissao-display');
                const avisoMeta = document.getElementById('aviso-meta');

                if (metaPessoal > 0 && meuTotal >= metaPessoal) {
                    comissaoCard.innerText = `R$ ${(meuTotal * 0.20).toLocaleString('pt-BR')}`;
                    comissaoCard.classList.add('text-emerald-400');
                    avisoMeta.innerText = "🏆 META BATIDA!";
                } else {
                    comissaoCard.innerText = "R$ 0,00";
                    avisoMeta.innerText = metaPessoal > 0 ? `Falta R$ ${(metaPessoal - meuTotal).toLocaleString('pt-BR')}` : "Defina meta";
                }
            }

            const rankingDiv = document.getElementById('ranking-lista');
            rankingDiv.innerHTML = "<h2 class='text-[10px] font-black uppercase text-gold mb-2'>Ranking</h2>";
            const ordenados = Object.entries(totaisPorFunc).sort((a,b) => b[1] - a[1]);
            if(ordenados[0]) document.getElementById('lider-ranking').innerText = ordenados[0][0];

            ordenados.forEach(([nome, total]) => {
                const meta = metas[nome]?.valor || 1;
                const perc = Math.min((total/meta)*100, 100).toFixed(0);
                rankingDiv.innerHTML += `
                    <div class="mb-2">
                        <div class="flex justify-between text-[9px] uppercase font-bold mb-1">
                            <span>${nome}</span>
                            <span>${perc}%</span>
                        </div>
                        <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden">
                            <div class="cup-gradient h-full transition-all duration-1000" style="width: ${perc}%"></div>
                        </div>
                    </div>
                `;
            });
            atualizarGrafico(totaisPorFunc);
        }

        function atualizarGrafico(dados) {
            const ctx = document.getElementById('chartPizza').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dados).map(n => n.toUpperCase()),
                    datasets: [{
                        data: Object.values(dados),
                        backgroundColor: ['#009639', '#FFDF00', '#002776'],
                        borderColor: '#000',
                        borderWidth: 4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: { size: 8 } } } }
                }
            });
        }

        window.gerarPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Relatorio Figurinha 2026", 14, 20);
            doc.autoTable({ html: '#tabela-print', startY: 30 });
            doc.save(`vendas_2026.pdf`);
        }

        initDashboard();
    </script>
</body>
</html>
